name: SoberCurfew
options:
  bundleIdPrefix: com.sobercurfew
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

targets:
  SoberCurfew:
    type: application
    platform: iOS
    sources:
      - path: SoberCurfew
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sobercurfew.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: SoberCurfew/Resources/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          OTHER_SWIFT_FLAGS: "-DDEBUG"
    entitlements:
      path: SoberCurfew/SoberCurfew.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access:
          - health-records
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.sobercurfew.app
        com.apple.security.application-groups:
          - group.com.sobercurfew.app
    dependencies:
      - target: SoberCurfewWatchApp
        embed: true
      - target: SoberCurfewWidget
        embed: true

  SoberCurfewWatchApp:
    type: application
    platform: watchOS
    sources:
      - path: SoberCurfewWatch
      - path: SoberCurfew/Models
      - path: SoberCurfew/Managers
      - path: SoberCurfew/Extensions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sobercurfew.app.watchkitapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: SoberCurfewWatch/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: SoberCurfewWatch/SoberCurfewWatch.entitlements
      properties:
        com.apple.developer.healthkit: true

  SoberCurfewWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SoberCurfewWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sobercurfew.app.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: SoberCurfewWidget/Info.plist
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
